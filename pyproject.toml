[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "httpbench"
version = "2.0.0"
description = "Sequential HTTP download benchmark using only the Python standard library"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
httpbench = "httpbench.cli:main"

[tool.setuptools]
packages = ["httpbench"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
files = ["httpbench", "main.py"]
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["httpbench"]
